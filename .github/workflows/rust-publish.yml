name: Publish to crates.io

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  # Required for the OIDC token exchange in rust-lang/crates-io-auth-action.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-29)
      - name: Validate workspace and qmd-rs package
        run: |
          cargo test --locked --workspace
          cargo test --locked -p qmd-rs --no-default-features
          cargo publish --locked --dry-run --package qmd-rs
      # Trusted Publishing: exchange a short-lived (30-minute) crates.io
      # token for this workflow's OIDC identity. No long-lived API token is
      # stored in repository secrets; the trusted publisher must be
      # configured on each crate's crates.io settings page
      # (owner remedialchaos, repository qmd-rs, workflow rust-publish.yml).
      - name: Exchange OIDC token for a short-lived crates.io publish token
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish qmd-rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --package qmd-rs
      - name: Wait for qmd-rs to reach crates.io
        run: sleep 30
      - name: Publish qmd-rs-cli with propagation retry
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for attempt in 1 2 3; do
            cargo publish --locked --dry-run --package qmd-rs-cli && cargo publish --locked --package qmd-rs-cli && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          exit 1
