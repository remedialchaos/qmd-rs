name: Publish to crates.io

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (2026-08-29)
      - name: Validate workspace and qmd package
        run: |
          cargo test --locked --workspace --all-features
          cargo publish --locked --dry-run --package qmd
      - name: Publish qmd
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --package qmd
      - name: Wait for qmd to reach crates.io
        run: sleep 30
      - name: Publish qmd-cli with propagation retry
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            cargo publish --locked --dry-run --package qmd-cli && cargo publish --locked --package qmd-cli && exit 0
            if [ "$attempt" -lt 3 ]; then
              sleep 30
            fi
          done
          exit 1
