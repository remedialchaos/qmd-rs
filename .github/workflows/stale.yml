name: Close Stale Issues and PRs

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  close-stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue is stale because it has been open 30 days with no activity."
          stale-pr-message: "This pull request is stale because it has been open 30 days with no activity."
          close-issue-message: "This issue was closed because it has been stale for 7 days with no activity."
          close-pr-message: "This pull request was closed because it has been stale for 7 days with no activity."
          days-before-stale: 30
          days-before-close: 7
